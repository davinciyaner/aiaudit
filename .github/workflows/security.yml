name: Security Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Install backend dependencies
        run: cd backend && yarn install --frozen-lockfile

      - name: Run yarn audit for backend
        run: cd backend && yarn audit --level moderate
        continue-on-error: true

      - name: Run security check for backend with Snyk
        run: |
          cd backend
          yarn global add snyk
          snyk auth ${{ secrets.SNYK_TOKEN }} || echo "Snyk token not configured"
          snyk test || true
        continue-on-error: true

      - name: Install frontend dependencies
        run: cd frontend && yarn install --frozen-lockfile

      - name: Run yarn audit for frontend
        run: cd frontend && yarn audit --level moderate
        continue-on-error: true

      - name: Run security check for frontend with Snyk
        run: |
          cd frontend
          yarn global add snyk
          snyk auth ${{ secrets.SNYK_TOKEN }} || echo "Snyk token not configured"
          snyk test || true
        continue-on-error: true

      - name: Run git secrets scan
        run: |
          npm install -g git-secrets
          git secrets --install
          git secrets --scan || true
        continue-on-error: true
