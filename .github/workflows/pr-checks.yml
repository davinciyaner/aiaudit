name: PR Quality Gate

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  pr-quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! $PR_TITLE =~ ^(feat|fix|docs|style|refactor|perf|test|chore)\(.*\): ]]; then
            echo "PR title must follow format: type(scope): description"
            exit 1
          fi
          echo "PR title format is correct"

      - name: Check PR has description
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if [ -z "$BODY" ] || [ ${#BODY} -lt 10 ]; then
            echo "PR description is required"
            exit 1
          fi
          echo "PR has valid description"

      - name: Comment PR with checklist
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## PR Quality Checklist \n\n- [ ] All tests pass\n- [ ] Security checks pass\n- [ ] Code quality gates pass\n- [ ] No new vulnerabilities introduced\n- [ ] Branch is up to date with main\n- [ ] Changelog updated (if needed)\n\nPlease ensure all items are checked before merge.`
            })
