name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Yarn
        run: npm install -g yarn

      - name: Install backend dependencies
        run: cd backend && yarn install --frozen-lockfile

      - name: Run ESLint on backend
        run: cd backend && yarn lint || echo "No ESLint configured"
        continue-on-error: true

      - name: Install frontend dependencies
        run: cd frontend && yarn install --frozen-lockfile

      - name: Run ESLint on frontend
        run: cd frontend && yarn lint

      - name: Check frontend code formatting
        run: cd frontend && yarn prettier --check . || echo "No Prettier configured"
        continue-on-error: true

      - name: Check for outdated dependencies (backend)
        run: cd backend && yarn outdated || echo "All dependencies are up to date"
        continue-on-error: true

      - name: Check for outdated dependencies (frontend)
        run: cd frontend && yarn outdated || echo "All dependencies are up to date"
        continue-on-error: true
